version: '3.8'
services:
  db:
    container_name: sgl_db
    image: datajoint/mysql:5.7
    environment:
      - MYSQL_ROOT_PASSWORD=coltrane
    volumes:
      - ./data:/var/lib/mysql
    networks:
      - sgl_network
  backend:
    container_name: sgl_backend
    build: backend
    ports:
      - "8050:8050"
    # The first bind mount allows updating backend app during development via Flask reloader module (debug mode).
    # The second exposes the root repository directory in the file system of the Docker host
    volumes:
      - ./backend/src:/code
      - ./repository:/repository
    depends_on:
      - db
    networks:
      - sgl_network
    environment:
      - MYSQL_ROOT_PASSWORD=coltrane
      - DJDEV_ROOT_REPO=/repository

networks:
  sgl_network:
