---
version: 1
disable_existing_loggers: False
formatters:
  simple:
    format: "[%(asctime)s] %(name)s | %(levelname)s - %(message)s"
  detailed:
    format: "[%(asctime)s] %(name)s | %(funcName)s in %(module)s @ %(lineno)s | %(levelname)s - %(message)s"

handlers:
  console_debug:
    class: logging.StreamHandler
    level: DEBUG
    formatter: detailed
    stream: ext://sys.stdout
  console_info:
    class: logging.StreamHandler
    level: INFO
    formatter: simple
    stream: ext://sys.stdout
  console_warning:
    class: logging.StreamHandler
    level: WARNING
    formatter: simple
    stream: ext://sys.stdout

loggers:
  # using an application-wide logger rather then module-level loggers. Here's where we control the level of detail
  # in the logs generated by application code (vs third-party code).
  portal:
    level: DEBUG
    propagate: False
    handlers: [console_debug]

root:
  level: WARNING
  handlers: [console_warning]