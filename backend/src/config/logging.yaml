---
version: 1
disable_existing_loggers: False
formatters:
  simple:
    format: "[%(asctime)s] %(name)s | %(levelname)s - %(message)s"
  custom:
    (): config.app_logging.custom_application_log_formatter

handlers:
  console_debug:
    class: logging.StreamHandler
    level: DEBUG
    formatter: custom
    stream: ext://sys.stdout
  console_warning:
    class: logging.StreamHandler
    level: WARNING
    formatter: simple
    stream: ext://sys.stdout
  file_backup:
    (): config.app_logging.custom_file_handler

loggers:
  # using an application-wide logger rather then module-level loggers. Here's where we control the level of detail
  # in the logs generated by application code (vs third-party code).
  portal:
    level: DEBUG
    propagate: False
    handlers: [console_debug, file_backup]

root:
  level: WARNING
  handlers: [console_warning]